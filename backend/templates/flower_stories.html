<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff5f2">
    <title>꽃말 이야기 — Flower Garden</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Gowun+Batang:wght@400;700&family=Allura&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/catalog.css?v=6">
    <link rel="stylesheet" href="/static/flower-stories.css?v=29">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/" aria-label="Flower Garden 홈"><span class="brand-mark" aria-hidden="true">❀</span><span>Flower Garden</span></a>
        <nav class="main-nav" aria-label="주 메뉴">
            <a class="nav-link" href="/">홈</a>
            <span class="nav-divider" aria-hidden="true"></span>
            <a class="nav-link" href="/flowers">꽃의 종류</a>
            <span class="nav-divider" aria-hidden="true"></span>
            <a class="nav-link active" href="/flower-stories" aria-current="page">꽃말 이야기</a>
            <span class="nav-divider" aria-hidden="true"></span>
            <a class="nav-link" href="/chat">꽃 챗봇</a>
        </nav>
        <form class="header-search" action="/" method="get">
            <input name="q" type="search" placeholder="꽃 이름 검색..." aria-label="꽃 검색">
            <button type="submit" aria-label="검색">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 4.3 4.3"></path></svg>
            </button>
        </form>
    </header>

    <main class="stories-page">
        <section class="stories-hero">
            <div class="stories-title">
                <h1>Flower Language</h1>
                <span class="title-heart" aria-hidden="true">♡</span>
            </div>
            <p><span aria-hidden="true">❀</span> 꽃에 담긴 특별한 의미, 꽃말 이야기를 만나보세요! <span aria-hidden="true">❀</span></p>
            <span class="stories-petal stories-petal-left" aria-hidden="true">❀</span>
        </section>

        <section class="stories-content" id="stories-list" aria-labelledby="stories-heading">
            <h2 id="stories-heading" class="sr-only">꽃말 이야기 목록</h2>
            <div id="story-color-options" class="story-category-options" aria-label="꽃말 카테고리"></div>
            <span id="stories-count" class="stories-count" aria-live="polite"></span>
            <div id="flower-stories" class="stories-grid" aria-live="polite">
                <p class="stories-message">꽃말 이야기를 불러오는 중입니다...</p>
            </div>
        </section>

        <aside class="stories-quote" aria-label="꽃말 이야기">
            <span aria-hidden="true">🌸</span>
            <p>꽃말은, 마음을 전하는 가장 아름다운 언어입니다.</p>
            <span class="quote-heart" aria-hidden="true">♡</span>
        </aside>

        <div id="story-detail-modal" class="story-modal" hidden>
            <section class="story-modal-panel" role="dialog" aria-modal="true" aria-labelledby="story-modal-name">
                <button class="story-modal-close" type="button" aria-label="상세 정보 닫기">×</button>
                <div class="story-modal-left">
                    <img id="story-modal-image" class="story-modal-image" alt="">
                </div>
                <div class="story-modal-content">
                    <div class="story-modal-heading">
                        <img id="story-modal-icon" class="story-modal-icon" alt="" aria-hidden="true">
                        <div>
                            <h2 id="story-modal-name"><span id="story-modal-korean-name"></span> <small id="story-modal-english-name"></small></h2>
                            <p id="story-modal-summary"></p>
                        </div>
                    </div>
                    <div class="story-modal-flourish" aria-hidden="true"><span>🌸</span></div>
                    <section class="story-modal-meanings" aria-label="꽃의 색깔과 꽃말">
                        <div class="story-modal-section">
                            <h3><span aria-hidden="true">🎨</span> 꽃의 색깔</h3>
                            <div id="story-modal-colors" class="story-modal-color-list"></div>
                        </div>
                        <div class="story-modal-section">
                            <h3><span aria-hidden="true">💗</span> 꽃말</h3>
                            <p id="story-modal-language" class="story-modal-language"></p>
                            <p id="story-modal-meaning" class="story-modal-meaning"></p>
                        </div>
                    </section>
                </div>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <a class="brand footer-brand" href="/"><span class="brand-mark" aria-hidden="true">❀</span><span>Flower Garden</span></a>
        <span class="copyright">© 2026 Flower Garden. All rights reserved.</span>
        <a class="stories-home-link" href="/">꽃 도감으로 돌아가기 ↑</a>
    </footer>
    <script src="/static/flower-stories.js?v=12"></script>
</body>
</html>
